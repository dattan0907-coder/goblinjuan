name: Build traveler (zip 6)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zip6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Generate Gradle wrapper (repo has none)
        if: hashFiles('gradlew') == ''
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build with wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: traveler-zip6-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test/build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traveler-zip6-reports
          path: build/reports/
          if-no-files-found: ignore

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
